name: Tako approved assertions
run-name: Tako approved assertions · ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, apply]
        default: plan
      plan_run:
        description: 'Completed plan run to apply; required for apply'
        default: ''
      plan_sha256:
        description: 'Exact SHA256 printed by the reviewed plan; required for apply'
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: tako-assertion-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[postgres,dev]'
      - run: pytest tests/test_tako_publish.py tests/test_web_research.py -q
      - name: Download exact preview
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN: ${{ inputs.plan_run }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          run=os.environ['PLAN_RUN']
          if not re.fullmatch(r'\d+',run):raise ValueError('A plan run is required')
          subprocess.run(['gh','run','download',run,'--name',f'tako-assertions-{run}','--dir','preview'],check=True)
          PY
      - name: Preview or append approved assertions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.IC_DB_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.IC_DB_DATABASE_URL_UNPOOLED }}
          MODE: ${{ inputs.mode || 'plan' }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pipeline.web_research.publish import run
          mode=os.environ['MODE']
          run(mode,Path('assertion-output'), 'preview/plan.json' if mode=='apply' else None,os.environ.get('PLAN_SHA256'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tako-assertions-${{ github.run_id }}
          path: assertion-output/
          retention-days: 90
