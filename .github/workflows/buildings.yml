# Buildings (pipeline/buildings.py): attach to each facility the Overture building its coordinate
# is in, propose the largest one within 30m when it is in none, and store every building within
# 150m as a candidate for people to attach. Writes facility_building, building_footprint, the
# review queue, and a building_sqft assertion per newly attached building; the assertion queues
# golden_dirty, and golden-refresh brings the square footage into golden.
#
# Each run judges facilities whose coordinate it has not judged yet, so dispatching it again
# continues where the last run stopped. The cost is one Overture parquet read (~1 minute) per
# distinct region, bounded by max_files.
name: buildings
run-name: "Buildings${{ inputs.refresh && ' (refresh)' || '' }}${{ inputs.dry_run && ' (dry run)' || '' }}"

concurrency:
  group: ic-warehouse-pipeline      # one warehouse writer at a time
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "facilities per run"
        type: string
        default: "500"
      max_files:
        description: "Overture parquet files read per run (about a minute each)"
        type: string
        default: "20"
      refresh:
        description: "re-judge facilities already judged at their current coordinate"
        type: boolean
        default: false
      sample:
        description: "test sample: blank = the next facilities in order · stated-sqft = only those a source states a plant size for · or comma-separated facility ids"
        type: string
        default: ""
      dry_run:
        description: "read Overture and report; write nothing"
        type: boolean
        default: true

permissions:
  contents: read

# bash -eo pipefail: without it `python ... | tee out.json` reports success when python fails.
defaults:
  run:
    shell: bash

jobs:
  buildings:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[postgres]" duckdb
      - name: Reuse the Overture file index across runs
        uses: actions/cache@v4
        with:
          path: enrich/overture_index.json
          key: overture-index-2026-08-19.0
      - name: Resolve the Neon warehouse connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.IC_DB_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.IC_DB_DATABASE_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"; echo "DATABASE_URL_UNPOOLED=$DATABASE_URL_UNPOOLED" >> "$GITHUB_ENV"; fi
          python .github/scripts/neon_connection_string.py
      - name: Run
        env:
          LIMIT: ${{ inputs.limit }}
          MAX_FILES: ${{ inputs.max_files }}
          REFRESH: ${{ inputs.refresh }}
          DRY_RUN: ${{ inputs.dry_run }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          mkdir -p enrich
          set -- --limit "${LIMIT:-500}" --max-files "${MAX_FILES:-20}"
          if [ "$REFRESH" = "true" ]; then set -- "$@" --refresh; fi
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          if [ "$SAMPLE" = "stated-sqft" ]; then set -- "$@" --only-with-stated-sqft
          elif [ -n "$SAMPLE" ]; then set -- "$@" --only "$SAMPLE"; fi
          python -m pipeline.buildings "$@" --report buildings-judgments.jsonl | tee buildings.json
          { echo '```json'; cat buildings.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Print the judgments (and a sample of outlines) to the log
        if: always()
        run: |
          [ -f buildings-judgments.jsonl ] || exit 0
          python - <<'PY'
          import json
          rows = [json.loads(l) for l in open("buildings-judgments.jsonl")]
          print("J|facility_id|outcome|status|area_sqft|distance_m|largest_30m_sqft|n_candidates")
          for j in rows:
              print("J|" + "|".join(str(j.get(k)) for k in ("facility_id", "outcome", "status", "area_sqft",
                                                             "distance_m", "largest_30m_sqft", "n_candidates")))
          sample = [j for j in rows if j["outcome"] == "contains_point"][:10] + \
                   [j for j in rows if j["outcome"] == "nearest_largest"][:5]
          for j in sample:
              print("G|" + j["facility_id"] + "|" + j["point"] + "|" + json.dumps(j["geometry"], separators=(",", ":")))
          PY
      - name: Keep every judgment (with the chosen outline) for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildings-judgments-${{ github.run_id }}
          path: buildings-judgments.jsonl
          if-no-files-found: ignore
