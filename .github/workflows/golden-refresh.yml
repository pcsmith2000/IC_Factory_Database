# Continuous golden (#44, epic #39): recompute the facilities whose assertions changed since golden
# last saw them. A trigger on fact_assertions fills golden_dirty; this drains it, one batch of
# facilities at a time, with the same survivorship rules and E10 state gate as promote.
name: golden-refresh
run-name: "Golden refresh${{ inputs.all && ' · all' || '' }}${{ inputs.dry_run && ' (dry run)' || '' }}"

concurrency:
  group: ic-warehouse-pipeline      # never beside an ingestion or enrichment run
  cancel-in-progress: false
on:
  schedule:
    - cron: "7,22,37,52 * * * *"    # every 15 minutes, off the :00 and :30 marks
  # GitHub drops most scheduled runs (13 fired in two days, ~4h apart), so the workflows that
  # write assertions also start a refresh when they finish. Draining the queue is idempotent.
  workflow_run:
    workflows: [monitor-fix, operator-apply, web-research-ingest, duplicates]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: "every registered facility, not just the queue (a full rebuild through the same path)"
        type: boolean
        default: false
      dry_run:
        description: "compute and report; write nothing, drain nothing"
        type: boolean
        default: true

permissions:
  contents: read

# bash -eo pipefail: without it `python ... | tee out.json` reports success when python fails.
defaults:
  run:
    shell: bash

jobs:
  refresh:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[postgres]"
      - name: Resolve the Neon warehouse connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.IC_DB_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.IC_DB_DATABASE_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"; echo "DATABASE_URL_UNPOOLED=$DATABASE_URL_UNPOOLED" >> "$GITHUB_ENV"; fi
          python .github/scripts/neon_connection_string.py
      # Every workflow here shares the ic-warehouse-pipeline group, and GitHub keeps only ONE pending
      # run per group: a newer queued run silently cancels the older pending one. A push that changes
      # control/operator_assertions.csv or control/monitor_fix_assertions.csv could so lose its
      # operator-apply / monitor-fix run (2026-09-29: two duplicates dispatches cancelled both). Both
      # appends are idempotent, so every real refresh re-applies the files on main first: a cancelled
      # apply is healed by the next refresh, which runs on a schedule and after every writer.
      - name: Re-apply people's rulings and monitor fixes (idempotent)
        if: inputs.dry_run != true
        continue-on-error: true           # a bad control file must not stop the queue from draining
        run: |
          python -m pipeline.operator_apply | tee operator.json
          python -m pipeline.monitor_fix | tee monitor_fix.json
          python3 -c "import json; o=json.load(open('operator.json')); m=json.load(open('monitor_fix.json')); print(f'operator: {o[\"written\"]} new, monitor_fix: {m[\"written\"]} new')" >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh
        env:
          ALL: ${{ inputs.all }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A scheduled run has no inputs: it drains the queue for real.
          set --
          [ "$ALL" = "true" ] && set -- "$@" --all
          [ "$DRY_RUN" = "true" ] && set -- "$@" --dry-run
          python -m pipeline.golden_refresh "$@" | tee refresh.json
          { echo '```json'; cat refresh.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
