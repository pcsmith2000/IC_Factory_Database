# Enrichment — stages 9 to 12, after the layers 1-8 release has loaded (docs/enrichment.md).
#
# Deterministic by construction: the Overture release, the model and the sample seed are pinned,
# and every assertion's row_hash is taken over the evidence that produced it, so a second run over
# unchanged inputs writes nothing new (ON CONFLICT DO NOTHING). Re-running is always safe.
#
# The AI is bounded and only in one stage: `locate` attempts at most `ai_limit` facilities per run
# (default 200), searches at most 4 times per facility, and caps tokens per call. Everything after
# it is deterministic. Setting ai_limit to 0 skips the AI entirely and the rest of the run is
# unchanged — that is the switch to reach for if a run must be reproducible to the token.
#
# By default nothing here touches the release database: a run works on its own Neon branch and
# deletes it at the end, so a layers 1-8 release publishing mid-run cannot collide and a failed run
# leaves the release exactly as it found it. `target: main` is the deliberate exception — it is how
# an enrichment pass is actually published — and it is never the default and never what a
# workflow_run trigger chooses.
#
# What lands is not the assertions. Stage 13 (promote) applies registry/survivorship.yaml to the
# release's assertions and rebuilds golden_facility, because golden is what every reader reads;
# without it a run writes rows nothing can see. That rebuild does not survive the next layers 1-8
# release, which rebuilds golden from its own assertions. Accepted while the two are separate
# actions (docs/enrichment.md).
name: enrich

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "which stages to run, comma separated"
        default: "plan,locate,geocode,footprint,existence,load,promote"
      target:
        description: "which database to write to"
        type: choice
        options: ["branch", "main"]
        default: "branch"
      ai_limit:
        description: "max facilities the AI stage may attempt (0 disables the AI entirely)"
        default: "200"
      model:
        description: "model id for the AI stage (blank = the pinned default)"
        default: ""
      search:
        description: "search provider for the AI stage: parallel | perplexity | exa | tako | native"
        default: ""
      sample:
        description: "work on a seeded stratified subset of this size (blank = all)"
        default: ""
      dry_run:
        description: "plan every stage, make no external call and write nothing"
        type: boolean
        default: false
      keep_branch:
        description: "keep the Neon branch after the run, to inspect what it wrote"
        type: boolean
        default: false
  workflow_run:
    workflows: ["pipeline-run"]
    types: [completed]

concurrency:
  group: enrich
  cancel-in-progress: false

permissions:
  contents: read

env:
  PY: "3.12"
  OUT: enrich

jobs:
  # ---------------------------------------------------------------- its own database
  branch:
    # a scheduled pipeline-run that failed has nothing worth enriching
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branch_id: ${{ steps.make.outputs.branch_id }}
      common_args: ${{ steps.args.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: args
        name: Spell the shared stage arguments once
        run: |
          A=""
          [ -n "${{ inputs.sample }}" ] && A="$A --sample ${{ inputs.sample }}"
          [ "${{ inputs.dry_run }}" = "true" ] && A="$A --dry-run"
          echo "common=$A" >> "$GITHUB_OUTPUT"

      # A run targeting main makes no branch, so branch_id stays empty — which is also what stops
      # cleanup from deleting anything. The workflow_run trigger never reaches this: it has no
      # inputs, so `inputs.target` is empty and the branch is made.
      - id: make
        name: Create this run's Neon branch
        if: inputs.target != 'main'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: python .github/scripts/neon_branch.py create "enrich-${{ github.run_id }}"

      - name: Say which database this run writes to
        run: |
          if [ "${{ inputs.target }}" = "main" ]; then
            echo "### Target: **main** — this run writes to the release database" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Target: a throwaway Neon branch — the release database is untouched" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------- one job per stage
  # Each stage is its own job via the reusable workflow, chained with needs:, so the run reads as
  # one process after the next and any single stage can be re-run on its own.
  plan:
    needs: branch
    uses: ./.github/workflows/enrich-stage.yml
    secrets: inherit
    with:
      stage: plan
      branch_id: ${{ needs.branch.outputs.branch_id }}
      run_key: ${{ github.run_id }}
      enabled: ${{ contains(inputs.stages, 'plan') || github.event_name == 'workflow_run' }}
      args: ${{ needs.branch.outputs.common_args }}

  locate:
    needs: [branch, plan]
    uses: ./.github/workflows/enrich-stage.yml
    secrets: inherit
    with:
      stage: locate
      branch_id: ${{ needs.branch.outputs.branch_id }}
      run_key: ${{ github.run_id }}
      # the AI stage is off unless it is both asked for and given a non-zero ceiling
      enabled: ${{ (contains(inputs.stages, 'locate') || github.event_name == 'workflow_run') && inputs.ai_limit != '0' }}
      args: >-
        ${{ needs.branch.outputs.common_args }} --limit ${{ inputs.ai_limit || 200 }}
        ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
        ${{ inputs.search && format('--search {0}', inputs.search) || '' }}

  geocode:
    needs: [branch, locate]
    if: always() && needs.branch.result == 'success'
    uses: ./.github/workflows/enrich-stage.yml
    secrets: inherit
    with:
      stage: geocode
      branch_id: ${{ needs.branch.outputs.branch_id }}
      run_key: ${{ github.run_id }}
      enabled: ${{ contains(inputs.stages, 'geocode') || github.event_name == 'workflow_run' }}
      args: ${{ needs.branch.outputs.common_args }}

  footprint:
    needs: [branch, geocode]
    if: always() && needs.branch.result == 'success'
    uses: ./.github/workflows/enrich-stage.yml
    secrets: inherit
    with:
      stage: footprint
      branch_id: ${{ needs.branch.outputs.branch_id }}
      run_key: ${{ github.run_id }}
      overture_release: "2026-08-19.0"
      enabled: ${{ contains(inputs.stages, 'footprint') || github.event_name == 'workflow_run' }}
      args: ${{ needs.branch.outputs.common_args }}

  existence:
    needs: [branch, footprint]
    if: always() && needs.branch.result == 'success'
    uses: ./.github/workflows/enrich-stage.yml
    secrets: inherit
    with:
      stage: existence
      branch_id: ${{ needs.branch.outputs.branch_id }}
      run_key: ${{ github.run_id }}
      enabled: ${{ contains(inputs.stages, 'existence') || github.event_name == 'workflow_run' }}
      args: ${{ needs.branch.outputs.common_args }}

  load:
    needs: [branch, existence]
    if: always() && needs.branch.result == 'success'
    uses: ./.github/workflows/enrich-stage.yml
    secrets: inherit
    with:
      stage: load
      branch_id: ${{ needs.branch.outputs.branch_id }}
      run_key: ${{ github.run_id }}
      enabled: ${{ (contains(inputs.stages, 'load') || github.event_name == 'workflow_run') && !inputs.dry_run }}
      args: ${{ needs.branch.outputs.common_args }}

  # Survivorship again, so the assertions the stages just appended are visible to every reader.
  # It is skipped on a dry run for the same reason load is: it replaces a table.
  promote:
    needs: [branch, load]
    if: always() && needs.branch.result == 'success'
    uses: ./.github/workflows/enrich-stage.yml
    secrets: inherit
    with:
      stage: promote
      branch_id: ${{ needs.branch.outputs.branch_id }}
      run_key: ${{ github.run_id }}
      enabled: ${{ (contains(inputs.stages, 'promote') || github.event_name == 'workflow_run') && !inputs.dry_run }}
      args: ${{ needs.branch.outputs.common_args }}

  # ---------------------------------------------------------------- always clean up
  cleanup:
    needs: [branch, plan, locate, geocode, footprint, existence, load, promote]
    if: always() && needs.branch.outputs.branch_id != '' && !inputs.keep_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Delete this run's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: python .github/scripts/neon_branch.py delete "${{ needs.branch.outputs.branch_id }}"
