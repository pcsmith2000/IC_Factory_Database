# One enrichment stage, as its own job. Called once per stage by enrich.yml so that each stage is
# separately visible, separately timed, and separately re-runnable from the Actions UI — a runner
# failure in stage 11 does not cost stages 9 and 10, and re-running stage 11 after an Overture
# release does not re-spend model tokens in stage 9.
#
# Stages hand work to each other as artifacts rather than as a shared workspace: every stage
# downloads what the earlier ones wrote, writes its own, and uploads that. `load` therefore sees
# every stage's assertions without any stage needing to know about the others.
name: enrich-stage

on:
  workflow_call:
    inputs:
      stage:      { required: true,  type: string }
      branch_id:  { required: true,  type: string }
      run_key:    { required: true,  type: string }
      args:       { required: false, type: string, default: "" }
      enabled:    { required: false, type: boolean, default: true }

jobs:
  stage:
    if: inputs.enabled
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[postgres]" duckdb

      - name: Collect what earlier stages wrote
        uses: actions/download-artifact@v4
        continue-on-error: true          # the first stage has nothing to collect
        with:
          pattern: enrich-${{ inputs.run_key }}-*
          merge-multiple: true
          path: enrich

      - name: Point at this run's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ inputs.branch_id }}
        run: |
          python - <<'EOF' >> "$GITHUB_ENV"
          import os, sys
          sys.path.insert(0, ".github/scripts")
          from neon_branch import call, project_id
          uri = call(f"/projects/{project_id()}/connection_uri"
                     f"?branch_id={os.environ['BRANCH_ID']}"
                     "&database_name=neondb&role_name=neondb_owner")["uri"]
          print(f"DATABASE_URL={uri}")
          EOF

      # A stage that needs a credential says so before it does any work, and names every spelling
      # it looked under. Secret names differ across this repo (CENSUS_KEY, IC_DB_ANTHROPIC_API_KEY,
      # NEON_API_KEY), and "GEOCODIO_API_KEY is not set" three minutes into a run does not say
      # whether the secret is absent or merely spelled differently.
      - name: Check the credentials this stage needs
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY || secrets.IC_DB_AI_GATEWAY_API_KEY || secrets.VERCEL_AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.IC_DB_ANTHROPIC_API_KEY }}
          GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY || secrets.GEOCODIO_API || secrets.IC_DB_GEOCODIO_API_KEY || secrets.GEOCODIO_KEY }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -u
          need=""
          case "${{ inputs.stage }}" in
            locate)  [ -n "${AI_GATEWAY_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ] || need="AI_GATEWAY_API_KEY | IC_DB_AI_GATEWAY_API_KEY | VERCEL_AI_GATEWAY_API_KEY (or ANTHROPIC_API_KEY | IC_DB_ANTHROPIC_API_KEY)" ;;
            geocode) [ -n "${GEOCODIO_API_KEY:-}" ] || need="GEOCODIO_API_KEY | GEOCODIO_API | IC_DB_GEOCODIO_API_KEY | GEOCODIO_KEY" ;;
          esac
          if [ -n "$need" ]; then
            # The secrets context lists what this repository actually has. Actions masks every
            # value in logs, and only the names are read here — enough to tell "the secret is
            # missing" from "the secret is spelled differently", which is the whole ambiguity.
            AVAILABLE=$(printf '%s' "$SECRETS_JSON" | jq -r 'keys | join(" ")' 2>/dev/null || echo "(could not read the secrets context)")
            {
              echo "### Stage ${{ inputs.stage }}: missing credential"
              echo ""
              echo "Looked for a secret under each of these names and found none set:"
              echo ""
              echo '```'
              echo "$need"
              echo '```'
              echo ""
              echo "Secret names this repository does have:"
              echo ""
              echo '```'
              echo "$AVAILABLE"
              echo '```'
              echo ""
              echo "If the credential is there under another name, add that spelling to"
              echo ".github/workflows/enrich-stage.yml. If this list is empty, the secret is"
              echo "scoped to a GitHub Environment and the job needs an environment: key."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::stage ${{ inputs.stage }} needs one of: $need"
            exit 1
          fi
          echo "credentials present for stage ${{ inputs.stage }}"

      - name: Run stage ${{ inputs.stage }}
        # Each credential accepts the canonical name or this repo's IC_DB_ naming, as run.yml does:
        # an unset secret reads as an empty string, so `||` falls through to the next spelling.
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY || secrets.IC_DB_AI_GATEWAY_API_KEY || secrets.VERCEL_AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.IC_DB_ANTHROPIC_API_KEY }}
          GEOCODIO_API_KEY: ${{ secrets.GEOCODIO_API_KEY || secrets.GEOCODIO_API || secrets.IC_DB_GEOCODIO_API_KEY || secrets.GEOCODIO_KEY }}
        run: python -m pipeline.enrich.run "${{ inputs.stage }}" --out enrich ${{ inputs.args }}

      - name: Publish what this stage wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-${{ inputs.run_key }}-${{ inputs.stage }}
          path: enrich/${{ inputs.stage }}*
          if-no-files-found: warn
          retention-days: 14
