# The permanent facility registry (epic #39): seed it from golden, or report its state.
# Main only: the registry is where IC-numbers are minted, and a branch must never write to it.
name: facility-registry
run-name: "Facility registry · ${{ inputs.command }}${{ inputs.dry_run && ' (dry run)' || '' }}"

concurrency:
  group: ic-warehouse-pipeline      # never beside an ingestion run that is reconciling ids
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      command:
        description: "seed = register every golden facility under its current number · status = report"
        type: choice
        options: ["status", "seed"]
        default: "status"
      dry_run:
        description: "seed only: check coverage and collisions, write nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  registry:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[postgres]"
      - name: Resolve the Neon warehouse connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.IC_DB_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.IC_DB_DATABASE_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"; echo "DATABASE_URL_UNPOOLED=$DATABASE_URL_UNPOOLED" >> "$GITHUB_ENV"; fi
          python .github/scripts/neon_connection_string.py
      - name: Run
        env:
          COMMAND: ${{ inputs.command }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$COMMAND" = "seed" ] && [ "$DRY_RUN" = "true" ]; then set -- seed --dry-run; else set -- "$COMMAND"; fi
          python -m pipeline.facility_registry "$@" | tee registry.json
          { echo '```json'; cat registry.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
