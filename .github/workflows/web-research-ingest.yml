# Web research ingestion: the external research agent inserts one cited JSON document per facility
# into web_research_submission; this validates each against docs/web-research-agent.md and writes
# what passes into fact_assertions + ref_source_row (source web_research). The trigger on
# fact_assertions queues the facility and golden-refresh (five minutes later, hourly) brings it into golden.
name: web-research-ingest
run-name: "Web research ingest${{ inputs.dry_run && ' (dry run)' || '' }}"

concurrency:
  group: ic-warehouse-pipeline      # never beside an ingestion, enrichment or golden refresh
  cancel-in-progress: false
on:
  schedule:
    - cron: "2 * * * *"             # hourly, five minutes before golden-refresh. Agents submit
                                    # rows and wait for this; they never dispatch it (docs/web-research-agent.md §1)
  workflow_dispatch:
    inputs:
      limit:
        description: "submissions per run"
        type: string
        default: "500"
      dry_run:
        description: "validate and report; write nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[postgres]"
      - name: Resolve the Neon warehouse connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.IC_DB_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.IC_DB_DATABASE_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"; echo "DATABASE_URL_UNPOOLED=$DATABASE_URL_UNPOOLED" >> "$GITHUB_ENV"; fi
          python .github/scripts/neon_connection_string.py
      - name: Ingest
        env:
          LIMIT: ${{ inputs.limit || '500' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A scheduled run has no inputs: it ingests for real.
          set -- --limit "$LIMIT"
          [ "$DRY_RUN" = "true" ] && set -- "$@" --dry-run
          python -m pipeline.web_research.ingest "$@" | tee ingest.json
          { echo '```json'; cat ingest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
