# Monitor fixes: the warehouse monitor's evidenced corrections (control/monitor_fix_assertions.csv,
# pipeline/monitor_fix.py) append to fact_assertions as source `monitor_fix`. The fact_assertions
# trigger queues each facility and the next golden-refresh brings the correction into golden.
# Runs when the file changes on main; a manual run defaults to a dry run.
name: monitor-fix
run-name: "Monitor fix apply${{ inputs.dry_run && ' (dry run)' || '' }}"

concurrency:
  group: ic-warehouse-pipeline      # never beside an ingestion, enrichment or golden refresh
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths: [control/monitor_fix_assertions.csv, pipeline/monitor_fix.py, .github/workflows/monitor-fix.yml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "validate and report; write nothing"
        type: boolean
        default: true

permissions:
  contents: read

# bash -eo pipefail: without it `python ... | tee out.json` reports success when python fails.
defaults:
  run:
    shell: bash

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[postgres]"
      - run: python -m pipeline.monitor_fix --check
      - name: Resolve the Neon warehouse connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.IC_DB_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.IC_DB_DATABASE_URL_UNPOOLED }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID || secrets.NEON_PROJECT_ID }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"; echo "DATABASE_URL_UNPOOLED=$DATABASE_URL_UNPOOLED" >> "$GITHUB_ENV"; fi
          python .github/scripts/neon_connection_string.py
      - name: Apply
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A push has no inputs: it applies for real.
          set --
          [ "$DRY_RUN" = "true" ] && set -- --dry-run
          python -m pipeline.monitor_fix "$@" | tee apply.json
          { echo '```json'; cat apply.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
