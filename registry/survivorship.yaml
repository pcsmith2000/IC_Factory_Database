# Survivorship rules — which assertion wins for each golden field. Versioned; part of the
# release tag. The golden table is a pure function of (assertions, id_registry, these rules).
#
# For each field: an ordered list of source preferences (first match wins), then a default.
# `adl_employee_feedback` is confirmed employee feedback and has first priority.
# `operator` is a human correction recorded as an assertion — it outranks every source.
# `site_visit` matches any assertion whose source carries site-visit attestation (OSHA).
#
# Enrichment (stages 9-12, docs/enrichment.md) asserts under source_class `enrichment` and is
# ranked here like any other source. Two of its fields need saying out loud:
#
#   lat_lon  `basis:rooftop` sits ABOVE class:B deliberately. Every coordinate class B publishes
#            is epa_frs, and EPA's are facility-self-reported: measured against Overture, 44% land
#            within 30m of any building and the median footprint of those is 4,583 sqft. A Geocodio
#            rooftop resolved 18 of 19 at a median of 63,968. Without this line the rooftop geocode
#            loses to the very coordinate stage 10 exists to replace.
#   address  `class:enrichment` sits LAST. A web-cited address is worth having where no registry
#            publishes one, and is worth less than any registry that does.
# Tako AI Search is always below the listed AND unlisted sources. golden._rank enforces
# this source-wide floor, rather than allowing it to tie an unlisted source on recency.
lowest_priority_sources: [tako_ai_search]
version: 5
default_order: [adl_employee_feedback, operator, site_visit, "class:A", "class:D", "class:B", "class:C"]
fields:
  name:            {order: [adl_employee_feedback, operator, "class:A", "class:D", "class:C", "class:B"], tie: most_recent}
  legal_name:      {order: [adl_employee_feedback, operator, lookup], tie: most_recent}
  address:         {order: [adl_employee_feedback, operator, site_visit, "class:D", "class:A", "class:B", "class:C", "class:enrichment"], tie: most_recent}
  city:            {order: [adl_employee_feedback, operator, site_visit, "class:D", "class:A", "class:B", "class:C"], tie: most_recent}
  state:           {order: [adl_employee_feedback, operator, "class:A", "class:D", "class:B", "class:C"], tie: most_recent}
  zip:             {order: [adl_employee_feedback, operator, site_visit, "class:D", "class:A", "class:B"], tie: most_recent}
  # basis:place_match is stage 13 — an Overture place carrying the same street address as the
  # facility. Measured against 241 verified rooftop coordinates: median 63m, p90 302m. That is
  # good enough to place a facility that has NO coordinate and not good enough to displace one
  # that has a real geocode, so it sits below basis:rooftop and only ever fills a hole.
  lat_lon:         {order: [adl_employee_feedback, operator, "basis:rooftop", "basis:place_match", "basis:interpolated_on_building", "class:B"], tie: most_recent}
  naics:           {order: [adl_employee_feedback, operator, "class:B"], tie: most_recent}
  status:          {order: [adl_employee_feedback, operator, "basis:dated_expiry", "basis:explicit_status_field", "basis:certified_as_of_date", "basis:on_current_list"], tie: most_recent}
  expiry_date:     {order: [adl_employee_feedback, operator, "basis:dated_expiry"], tie: most_recent}
  # product_type is asserted by the Layer 3 classifier, never by a source roster, so the old
  # class-based order could never match and the field stayed empty. A human correction still
  # outranks the model.
  product_type:    {order: [adl_employee_feedback, operator, classifier], tie: most_recent}
  # Added 2026-09-17. A registry (class A) states a website as printed; the enrichment pass (class
  # D) cites the company's own site. Square footage and open/closed status come almost only from
  # the enrichment pass today, so class D leads; a registry's explicit status field outranks it
  # for operating_status because a revoked registration is a stronger claim than a listing.
  website:          {order: [adl_employee_feedback, operator, "class:A", "class:D", "class:C", "class:B", "basis:place_match"], tie: most_recent}
  sq_ft:            {order: [adl_employee_feedback, operator, "class:D", "class:A", "class:B"], tie: most_recent}
  operating_status: {order: [adl_employee_feedback, operator, "basis:explicit_status_field", "class:D", "class:A"], tie: most_recent}
  # Added 2026-09-18. A state registry prints the number the manufacturer filed with it, which is
  # the one that gets answered; an association directory prints whatever the member last updated,
  # and a member roster is the likelier place for a sales line. Registry (A) first, roster (B/C)
  # after, enrichment last because a number found by search is the weakest claim of the four.
  phone:            {order: [adl_employee_feedback, operator, "class:A", "class:B", "class:C", "class:D", "basis:place_match"], tie: most_recent}
  # ADL's own plant lists (class D) are the only source of any of these, so the order is a
  # formality — but operator corrections still outrank them, as everywhere else.
  email:               {order: [adl_employee_feedback, operator, "class:A", "class:B", "class:C", "class:D"], tie: most_recent}
  adl_validated:       {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  primary_capability:  {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  # Stage 15, 2026-09-21. capability_leaf and capability_group are the model's reading of the
  # MERGED record against registry/taxonomy.yaml. `capability` is below class:D on purpose and it
  # is not a formality: class D is ADL's own plant lists, which carry primary_capability, and
  # those 218 rows are the ground truth this stage is SCORED against. A stage that could overwrite
  # its own answer key would make its measurement meaningless — 0.899 by group and 0.706 by leaf
  # on run 35638112033, against a deterministic floor of 0.417 and 0.307.
  capability_group:    {order: [adl_employee_feedback, operator, "class:D", capability], tie: most_recent}
  capability_leaf:     {order: [adl_employee_feedback, operator, "class:D", capability], tie: most_recent}
  secondary_capability: {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  material:            {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  sector:              {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  throughput:          {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  throughput_unit:     {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  utilisation_pct:     {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  vacant_capacity:     {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  annual_revenue_usd:  {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  automation_level:    {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  states_serviced:     {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  country_based:       {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  value_basis:         {order: [adl_employee_feedback, operator, "class:D"], tie: most_recent}
  # Measured, not stated — and deliberately NOT merged into the two fields above.
  #
  # sq_ft is what a source SAYS the plant is; building_sqft is what its Overture footprint
  # MEASURES. operating_status is what a registry says; existence_flag is what stage 12 concluded
  # from a footprint too small for the trade or from no building at all. Collapsing each pair would
  # throw away the only case that carries information: the one where the claim and the measurement
  # disagree. A consumer wanting one number should read sq_ft and fall back to building_sqft; a
  # consumer auditing the roster wants both side by side.
  building_sqft:   {order: [adl_employee_feedback, operator, "basis:footprint"], tie: most_recent}
  existence_flag:  {order: [adl_employee_feedback, operator, "basis:advisory"], tie: most_recent}

  # Free-text employee observations that do not fit a structured warehouse field.
  employee_notes: {order: [adl_employee_feedback, operator], tie: most_recent}

  # The consumer's one number. A derived field pools the assertions of several fields and ranks
  # them as one contest, so golden carries the single value most likely to be right and names its
  # source. floor_area_sqft: a stated plant size (ADL's lists first, then any registry) beats the
  # measured footprint, which fills the hole when nothing was stated. A value that does not read
  # as a plausible plant size (below 500 or above 20,000,000 sq ft, or not a number) cannot win.
  # sq_ft and building_sqft stay side by side for the auditor, as the note above explains.
derived:
  floor_area_sqft: {from: [sq_ft, building_sqft], order: [adl_employee_feedback, operator, "class:D", "class:A", "class:B", "class:C", "basis:footprint"], tie: most_recent, min: 500, max: 20000000}

# Operational flags: fields an enrichment stage asserts for its own bookkeeping and that never
# reach golden. geocode_quality records "Geocodio could not place this address at rooftop" so the
# next run skips it (pipeline/enrich/geocode.py). They carry no survivorship order, but they are
# field_keys in fact_assertions, so the loader gives each a dim_field row (order NULL) and a join
# fact_assertions ⋈ dim_field does not silently drop them. A new flag-only field goes here.
flag_fields: [geocode_quality]
