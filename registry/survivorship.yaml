# Survivorship rules — which assertion wins for each golden field. Versioned; part of the
# release tag. The golden table is a pure function of (assertions, id_registry, these rules).
#
# For each field: an ordered list of source preferences (first match wins), then a default.
# `operator` is a human correction recorded as an assertion — it outranks every source.
# `site_visit` matches any assertion whose source carries site-visit attestation (OSHA).
#
# Enrichment (stages 9-12, docs/enrichment.md) asserts under source_class `enrichment` and is
# ranked here like any other source. Two of its fields need saying out loud:
#
#   lat_lon  `basis:rooftop` sits ABOVE class:B deliberately. Every coordinate class B publishes
#            is epa_frs, and EPA's are facility-self-reported: measured against Overture, 44% land
#            within 30m of any building and the median footprint of those is 4,583 sqft. A Geocodio
#            rooftop resolved 18 of 19 at a median of 63,968. Without this line the rooftop geocode
#            loses to the very coordinate stage 10 exists to replace.
#   address  `class:enrichment` sits LAST. A web-cited address is worth having where no registry
#            publishes one, and is worth less than any registry that does.
version: 2
default_order: [operator, site_visit, "class:A", "class:D", "class:B", "class:C"]
fields:
  name:            {order: [operator, "class:A", "class:D", "class:C", "class:B"], tie: most_recent}
  legal_name:      {order: [operator, lookup], tie: most_recent}
  address:         {order: [operator, site_visit, "class:D", "class:A", "class:B", "class:C", "class:enrichment"], tie: most_recent}
  city:            {order: [operator, site_visit, "class:D", "class:A", "class:B", "class:C"], tie: most_recent}
  state:           {order: [operator, "class:A", "class:D", "class:B", "class:C"], tie: most_recent}
  zip:             {order: [operator, site_visit, "class:D", "class:A", "class:B"], tie: most_recent}
  lat_lon:         {order: [operator, "basis:rooftop", "class:B"], tie: most_recent}
  naics:           {order: [operator, "class:B"], tie: most_recent}
  status:          {order: [operator, "basis:dated_expiry", "basis:explicit_status_field", "basis:certified_as_of_date", "basis:on_current_list"], tie: most_recent}
  expiry_date:     {order: [operator, "basis:dated_expiry"], tie: most_recent}
  # product_type is asserted by the Layer 3 classifier, never by a source roster, so the old
  # class-based order could never match and the field stayed empty. A human correction still
  # outranks the model.
  product_type:    {order: [operator, classifier], tie: most_recent}
  # Added 2026-09-17. A registry (class A) states a website as printed; the enrichment pass (class
  # D) cites the company's own site. Square footage and open/closed status come almost only from
  # the enrichment pass today, so class D leads; a registry's explicit status field outranks it
  # for operating_status because a revoked registration is a stronger claim than a listing.
  website:          {order: [operator, "class:A", "class:D", "class:C", "class:B"], tie: most_recent}
  sq_ft:            {order: [operator, "class:D", "class:A", "class:B"], tie: most_recent}
  operating_status: {order: [operator, "basis:explicit_status_field", "class:D", "class:A"], tie: most_recent}
  # Measured, not stated — and deliberately NOT merged into the two fields above.
  #
  # sq_ft is what a source SAYS the plant is; building_sqft is what its Overture footprint
  # MEASURES. operating_status is what a registry says; existence_flag is what stage 12 concluded
  # from a footprint too small for the trade or from no building at all. Collapsing each pair would
  # throw away the only case that carries information: the one where the claim and the measurement
  # disagree. A consumer wanting one number should read sq_ft and fall back to building_sqft; a
  # consumer auditing the roster wants both side by side.
  building_sqft:   {order: [operator, "basis:footprint"], tie: most_recent}
  existence_flag:  {order: [operator, "basis:advisory"], tie: most_recent}
