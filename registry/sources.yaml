- id: lead_addresses
  name: Street addresses found for existing T0 leads (enrichment pass)
  class: D
  method: upload
  needs_classify: false
  acquire: blob-only
  carries:
  - plant_address
  status_basis: none
  traps:
  - 'NOT a way to put the control list into the database. Every row must be a plant a real source already surfaced as a lead; the lookup adds a street, never a facility. Rows added because the control names them make recall self-fulfilling, and G4 refuses control provenance.'
  - 'Each row is an assertion: source_url names where the street came from and evidence says what kind of page. A street off a search result without a source_url is not a row.'
  status: active
- id: ga_dca
  name: Georgia DCA approved industrialized building manufacturers
  class: A
  method: download
  acquire: blob-only
  needs_classify: true
  classify_all: true               # no NAICS on a registry row; every row goes to the classifier
  carries:
  - plant_address
  - explicit_status
  status_basis: on_current_list
  url: https://dca.georgia.gov/document/fact-sheets/approved-industrialized-building-manufacturers/download
  traps:
  - 'A NATIONAL roster with STREETS: Georgia approves everyone who ships into the state, and every row carries Name, Phone, Address, Occupancy. 101 manufacturers across 20+ states; 58 carry a website. Found 2026-09-17 while enriching ProMod Manufacturing.'
  - 'A browser print of a web table, and its text order is not its visual order. Read by COLUMN x-position from the header, never as text; a record is complete on its "(City, ST)" tag plus a City-ST-ZIP in the address column, judged with the email/phone/URL that share the column stripped first.'
  - 'Occupancy is what the manufacturer is APPROVED TO SELL INTO GEORGIA, not what it makes: Trachte is approved for Storage and makes pre-engineered metal buildings. So occupancy rides in notes as evidence and the classifier decides — needs_classify: true. 28 of 101 are storage/hazardous/utility-only.'
  - 'Two records occasionally print as one (a name tail wraps after its record is complete). Detected as two City-ST-ZIPs in one address column and HELD BACK rather than published wrong; the note counts them.'
  - 'The second PDF, active-directory-51525, is a 2MB scanned image: zero extractable text. Archived beside the first; not parsed.'
  status: active
- id: mo_psc
  name: Missouri PSC registered manufacturers (modular and HUD-code)
  class: A
  method: fetch
  acquire: blob-only
  needs_classify: false
  carries:
  - plant_address
  - manufacturer_id
  status_basis: on_current_list
  url: https://psc.mo.gov/ManufacturedHousing/Manufacturer_Information
  traps:
  - 'TWO lists, both national and both with a street on every row: ACTIVE MOD (135 modular registrations) and ACTIVE HUD (67 HUD-code, NAICS 321991). 202 rows across TX 43, IN 28, AL 19, TN 14, GA 14, WI 10, MO 10. 17 give a PO Box, which correctly yields no street key.'
  - 'The PDF filename carries a date and the previous URL 404s within months: discover the links from Manufacturer_Information, never pin them. Verified 2026-09-17: the 2-10-25 link recorded that morning was already gone; 6-2-26 and 9-15-25 are current.'
  - 'Read by COLUMN from the header, with each boundary at the midpoint between the last word of one header group and the first of the next. Midpoints between first words put the Registration/Name boundary inside the name and truncated "ADVENTURE HOMES LLC" to "HOMES LLC"; header x0 alone shifted every column one to the left and the HUD list yielded nothing.'
  status: active
- id: forest_products_locator
  name: Secondary Forest Products Locator (forestproductslocator.org)
