- id: superior_walls
  name: Superior Walls licensed precast manufacturers
  class: C
  method: fetch
  url: https://www.superiorwalls.com/wp-json/wp/v2/pages?per_page=100
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  status: active
  traps:
  - The locator page renders client-side and serves nothing. The licensee list is in the WordPress REST API.
  - The API's `content` is raw shortcode whose image URLs parse as street numbers — read the RENDERED page.
  - Every page carries the New Holland PA corporate address as well as the plant's. Anchor on 'Contact Information' and cut
    at 'CORPORATE OFFICES'.
- id: woodworks_mass_timber
  name: WoodWorks mass timber manufacturer & fabricator locations
  class: C
  method: fetch
  url: https://www.woodworks.org/wp-content/uploads/mass_timber_manufacturer_locations.pdf
  needs_classify: false
  carries:
  - plant_city
  status_basis: on_current_list
  status: active
  traps:
  - 'The PDF is a MAP, not a table: straight text extraction interleaves both panels word by word. Read only x0 < 160, the
    left alphabetical list.'
  - Town and state only — this roster prints no street addresses.
  - About a third of the roster is Canadian; count and skip rather than coercing to a US state.
  - '''Vancouver & Washougal, WA'' is ambiguous (the company is Vancouver, BC). Both rows are emitted verbatim rather than
    guessed.'
- id: mbma
  name: MBMA members
  class: D
  method: browser
  needs_classify: false
  carries:
  - company_address
  status_basis: on_current_list
  traps:
  - 'Built 2026-09-17. The rendered directory is an infinite scroll (views-infinite-scroll-content-wrapper): the first render holds one page, so the fetcher scrolls until the member count stops growing and raises rather than publish a truncated roster. 40 US members, all with a street, 21 states; 4 non-US skipped (the state filter lists Alberta and Ontario beside the states). Archived as rendered HTML because CI has no Chromium - acquire is blob-only.'
  - 'Probed 2026-09-17: mbma.com/membership/member-directory and /members both 404. The real page is /building-systems-directory, HTTP 200 but 35KB of shell with no member content in the HTML - JS-rendered, so it needs _browser.py, not http_get. /associate-directory is the other half. Worth doing: 10 control rows are Steel Structural Components.'
  - Company-level, not plant-level.
  acquire: blob-only
  status: active
- id: nfba
  name: NFBA post-frame manufacturers
  class: D
  method: browser
  needs_classify: false
  carries:
  - company_address
  status_basis: on_current_list
  traps:
  - 'Probed 2026-09-17: /members and /find-a-builder both return HTTP 410 Gone. NFBA runs its directory on an AWS-hosted member area (/aws/NFBA/pt/sp/...) that answers 410 to an unauthenticated fetch. Post-frame overlaps the 11 LGS/steel panel control rows only partly; try MBMA first.'
  - Unverified.
  status: queued
