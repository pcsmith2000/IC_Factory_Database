version: 1
sources:
- id: pa_dced
  name: Pennsylvania DCED industrialized housing — plant list
  class: A
  method: download
  url: https://dced.pa.gov/housing-and-development/website-list-of-manufacturers/
  needs_classify: false
  carries:
  - plant_address
  - evaluation_agency
  - inspection_agency
  status_basis: on_current_list
  traps:
  - Published by DCED, not L&I. L&I carries the code, not the registry.
  - Only ~36 of 112 rows are PA plants; the rest are out-of-state and Canadian plants approved to ship in.
  - Source typos are verbatim ("Bladwin GA", "Mifflinburg, IN") — keep them.
  status: active
- id: tx_tdlr
  name: Texas TDLR industrialized housing — certified and registered manufacturers
  class: A
  method: download
  url: https://www.tdlr.texas.gov/ihb/ihblists.htm
  needs_classify: false
  carries:
  - plant_address
  - expiry_date
  status_basis: dated_expiry
  traps:
  - Certified and registered lists are different populations; pull both.
  - Only source in class A with expiry dates — the best liveness signal in the dataset.
  status: active
- id: mi_lara
  name: Michigan — premanufactured units (list is under Plan Review)
  class: A
  method: download
  url: https://www.michigan.gov/lara/bureau-list/bcc/sections/plan-review/premanufactured-units/premanufactured-units-program
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  traps:
  - The list lives under Plan Review, not the Premanufactured Units program page (dead end).
  - Typos verbatim ("Shangahi").
  acquire_note: no list published; obtain from the Bureau and upload to the archive
  status: active
- id: ma_bbrs
  name: Massachusetts BBRS manufactured buildings
  class: A
  method: download
  url: https://www.mass.gov/info-details/manufactured-building-program
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  traps:
  - Undated PDF; still lists Kullman, Excel Homes, Modtech — defunct 10+ years. Status is inferred.
  acquire_note: no list published and mass.gov blocks automation; upload to the archive
  status: queued
- id: or_bcd
  name: Oregon BCD prefabricated structures — by manufacturing location
  class: A
  method: browser
  url: https://www.oregon.gov/bcd/permit-services/prefab/Documents/prefab-registered-manufacturers.pdf
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  traps:
  - Registers per manufacturing location (cleanest match to our unit of record).
  - The official "list" PDF contains no data; use the licence search.
  acquire_note: licence search needs a browser; upload the exported result
  status: active
- id: fl_bcis
  name: Florida BCIS manufactured buildings
  class: A
  method: browser
  url: https://floridabuilding.org/mb/mb_default.aspx
  needs_classify: false
  carries:
  - plant_name
  - material_system_in_plan_docs_only
  status_basis: on_current_list
  traps:
  - POST-only search; defeats plain fetch.
  - 852 rows are names only. Do not promote unmatched names to facilities.
  - Material is not structured data; it lives in plan documents.
  acquire_note: POST-only search; upload the exported result
  status: active
- id: ny_dos
  name: New York DOS factory manufactured buildings
  class: A
  method: download
  url: https://dos.ny.gov/code/factory-manufactured-buildings-modular
  needs_classify: false
  carries:
  - approval_records
  status_basis: on_current_list
  traps:
  - Approval-centric, not plant-centric; extraction not clean. FOIL request drafted.
  acquire_note: no list published and dos.ny.gov blocks automation; upload the FOIL response
  status: queued
- id: in_dhs
  name: Indiana DHS industrialized building systems registry
  class: A
  method: fetch
  needs_classify: false
  carries:
  - plant_address
  - manufacturer_id
  status_basis: on_current_list
  traps:
  - 'NOT an Indiana list: Indiana registers every manufacturer selling into the state, so the roster is national — 409 US
    plants across 46 states.'
  - 'Marked method: browser and left queued for months. It is a plain-HTML Struts app; no browser needed.'
  - Serves Windows-1252. Decoding as UTF-8 turned 'Mécanitec' into mojibake in the company's own name.
  - 'Keeps tombstones in place: one listing is a manufacturer named DELETE at a street address of DELETE.'
  - ZIPs are dirty (six and nine digits, some absent). Validate the STATE against the US list, never the ZIP — requiring a
    clean ZIP threw away six real plants.
  - Covers volumetric modular and mobile structures, not components. It overlaps the ADL control list by exactly one row.
  status: active
  url: https://oas.dhs.in.gov/dfbs/code/main.do
- id: nc_osfm
  name: North Carolina OSFM modular search
  class: A
  method: browser
  needs_classify: false
  carries:
  - plant_address
  - explicit_status
  status_basis: explicit_status_field
  traps:
  - Form-gated.
  status: queued
- id: ca_hcd
  name: California HCD factory-built housing
  class: A
  method: browser
  needs_classify: false
  carries:
  - business_address_often_hq
  status_basis: on_current_list
  traps:
  - HCD issues no plant-level approval number; identifiers are per-model and per-unit. Plant identity is structurally unavailable.
  - Treat rows as company-level leads. Cap at T1 without a second source.
  status: leads_only
- id: epa_frs
  name: EPA Facility Registry Service — national file
  class: B
  method: bulk
  url: https://ordsext.epa.gov/FLA/www3/state_files/national_combined.zip
  needs_classify: true
  carries:
  - lat_long
  - naics
  - program_ids
  status_basis: none
  core_naics:
  - '321991'
  - '321992'
  - '332311'
  - '321214'
  traps:
  - 5.3M rows. Joins on the API return 500; use the bulk file.
  - 321992 is mixed (~45% IC, ~33% sheds); some records are permits, not plants ("...Parking Expansion").
  - OSHA-OIS program rows are site visits — the strongest address attestation available.
  status: active
- id: osha_enforcement
  name: OSHA enforcement establishments
  class: B
  method: bulk
  needs_classify: true
  url: https://preview.osha.gov/
  carries:
  - site_visit_address
  status_basis: none
  traps:
  - Unlocks verification tier T3.
  status: queued
- id: iibc
  name: IIBC registered manufacturers
  class: C
  method: fetch
  url: https://interstateibc.org/manufacturers/
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  traps:
  - 258 rows dated Oct 2024 — not the ~700 a scout claimed. Pre-registered prediction caught this.
  status: active
- id: mhi_plants
  name: MHI HUD-code plant list
  class: C
  method: fetch
  url: https://www.manufacturedhousing.org/wp-content/uploads/2024/10/Plant-List-10_3_24.pdf
  needs_classify: false
  carries:
  - plant_code
  - plant_address
  status_basis: on_current_list
  traps:
  - Plant codes are durable per-facility identifiers; capture them.
  status: active
- id: corporate_locations
  name: Corporate location pages — 13 multi-site component companies
  class: C
  method: fetch
  needs_classify: false
  ai_extraction: true
  carries:
  - plant_address
  status_basis: on_current_list
  pages:
  - company: UFP Site Built
    url: https://ufpsitebuilt.com/our-locations
    follow:
      href: /our-locations/
  - company: 84 Lumber
    url: https://www.84lumber.com/manufacturing/
  - company: Stark Truss
    url: https://www.starktruss.com/locations/
  - company: The Truss Company
    url: https://www.thetrussco.com/locations/
  - company: Parr Truss
    url: https://parr.com/locations/
  - company: ABS
    url: null
  - company: Banker Steel
    url: https://www.bankersteel.com/contact/
  - company: True House
    url: https://www.truehouse.com/
  traps:
  - Prose pages; extraction only — verbatim check against the archived page.
  - Targets the biased sample; it is a roster, not a regulator.
  - 'Builders FirstSource was removed from this list on 2026-09-17: bldr_locations reads the same site deterministically from
    its branch codes. The model extraction here returned zero rows from bldr.com because the index page carries links and
    no addresses.'
  status: active
- id: bldr_locations
  name: Builders FirstSource manufacturing plants (own location index)
  class: C
  method: fetch
  url: https://www.bldr.com/location/all-locations
  needs_classify: false
  carries:
  - plant_address
  - branch_code
  status_basis: on_current_list
  traps:
  - 'Branch code suffix is the only reliable site type: MF is manufacturing, YD a lumber yard. Pull MF only.'
  - The footer carries the Irving TX corporate address on EVERY page — take city and state from the title, never the body.
  - Some pages render the address client-side; those rows keep city and state and no street rather than borrowing the footer's.
  status: active
- id: sbca
  name: SBCA component manufacturer directories
  class: C
  method: fetch
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  traps:
  - The truss segment is invisible to every regulator source; this is its only roster.
  status: queued
- id: pci_certified
  name: PCI certified plants (republished in Ascent magazine)
  class: D
  method: browser
  needs_classify: false
  ai_extraction: true
  carries:
  - plant_address
  - product_codes
  status_basis: certified_as_of_date
  traps:
  - Live search is an empty JS form; the Ascent directory ("AS OF JUNE 2026") is the usable form.
  - Product codes separate building-envelope precast from bridge plants.
  status: queued
- id: mbi_members
  name: MBI member directory
  class: D
  method: fetch
  url: https://members.modular.org/{directory}/FindStartsWith?term={letter}
  acquire: web-first
  needs_classify: false
  carries:
  - street_address
  - manufacturer_or_dealer_flag
  status_basis: on_current_list
  traps:
  - 26-fetch A–Z sweep. Manufacturer/Direct field mechanically separates plants from dealers.
  - Membership is international. 31 of 182 manufacturers are outside the US (ON, Varsinais-Suomi, ...); a two-letter state
    is not proof of a US row, since Canadian provinces are two letters too.
  - An empty letter is normal (Y has 0 members, X and Z have 1); only an empty DIRECTORY is a fault.
  status: active
- id: apa_mills
  name: APA certified mills
  class: D
  method: browser
  needs_classify: false
  carries:
  - mill_number
  - plant_address
  status_basis: certified
  traps:
  - Mill numbers are a stable per-facility join key — capture for cross-source dedupe.
  status: queued
- id: ias_ac472
  name: IAS AC472 accredited metal building plants
  class: D
  method: browser
  needs_classify: false
  carries:
  - plant_address
  status_basis: accredited
  traps:
  - Accredits the plant, not the corporation (~215 numbers). Better instrument for NAICS 332311 than MBMA.
  status: queued
- id: aisc_certified
  name: AISC certified companies
  class: D
  method: browser
  needs_classify: false
  carries:
  - plant_address
  status_basis: certified
  traps:
  - 403s every plain fetch. Browser job.
  status: queued
- id: sipa
  name: SIPA manufacturing members
  class: C
  method: fetch
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  status: active
  url: https://www.sips.org/members/manufacturing
  traps:
  - Manufacturing is one of five member categories; read only /members/manufacturing.
  - The street address exists only on the member profile, and only in the paragraph headed by that member's own name — the
    same sidebar renders projects and sponsors.
- id: superior_walls
  name: Superior Walls licensed precast manufacturers
  class: C
  method: fetch
  url: https://www.superiorwalls.com/wp-json/wp/v2/pages?per_page=100
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  status: active
  traps:
  - The locator page renders client-side and serves nothing. The licensee list is in the WordPress REST API.
  - The API's `content` is raw shortcode whose image URLs parse as street numbers — read the RENDERED page.
  - Every page carries the New Holland PA corporate address as well as the plant's. Anchor on 'Contact Information' and cut
    at 'CORPORATE OFFICES'.
- id: woodworks_mass_timber
  name: WoodWorks mass timber manufacturer & fabricator locations
  class: C
  method: fetch
  url: https://www.woodworks.org/wp-content/uploads/mass_timber_manufacturer_locations.pdf
  needs_classify: false
  carries:
  - plant_city
  status_basis: on_current_list
  status: active
  traps:
  - 'The PDF is a MAP, not a table: straight text extraction interleaves both panels word by word. Read only x0 < 160, the
    left alphabetical list.'
  - Town and state only — this roster prints no street addresses.
  - About a third of the roster is Canadian; count and skip rather than coercing to a US state.
  - '''Vancouver & Washougal, WA'' is ambiguous (the company is Vancouver, BC). Both rows are emitted verbatim rather than
    guessed.'
