- id: corporate_locations
  name: Corporate location pages — 13 multi-site component companies
  class: C
  method: fetch
  needs_classify: false
  ai_extraction: true
  carries:
  - plant_address
  status_basis: on_current_list
  pages:
  - company: UFP Site Built
    url: https://ufpsitebuilt.com/our-locations
    follow:
      href: /our-locations/
  - company: 84 Lumber
    url: https://www.84lumber.com/manufacturing/
  - company: Stark Truss
    url: https://www.starktruss.com/locations/
  - company: The Truss Company
    url: https://www.thetrussco.com/locations/
  - company: Parr Truss
    url: https://parr.com/locations/
  - company: ABS
    url: null
  - company: Banker Steel
    url: https://www.bankersteel.com/contact/
  - company: True House
    url: https://www.truehouse.com/
  traps:
  - Prose pages; extraction only — verbatim check against the archived page.
  - Targets the biased sample; it is a roster, not a regulator.
  - 'Builders FirstSource was removed from this list on 2026-09-17: bldr_locations reads the same site deterministically from
    its branch codes. The model extraction here returned zero rows from bldr.com because the index page carries links and
    no addresses.'
  status: active
- id: bldr_locations
  name: Builders FirstSource manufacturing plants (own location index)
  class: C
  method: fetch
  url: https://www.bldr.com/location/all-locations
  needs_classify: false
  carries:
  - plant_address
  - branch_code
  status_basis: on_current_list
  traps:
  - 'Branch code suffix is the only reliable site type: MF is manufacturing, YD a lumber yard. Pull MF only.'
  - The footer carries the Irving TX corporate address on EVERY page — take city and state from the title, never the body.
  - Some pages render the address client-side; those rows keep city and state and no street rather than borrowing the footer's.
  status: active
- id: sbca
  name: SBCA component manufacturer directories
  class: C
  method: fetch
  needs_classify: false
  carries:
  - plant_address
  status_basis: on_current_list
  traps:
  - 'Probed 2026-09-17: sbcindustry.com does not answer at all (curl exit 000, no HTTP status), not merely login-gated. Still the single biggest prize - 23 of the 122 never-ingested control rows are Wood Structural Components.'
  - The truss segment is invisible to every regulator source; this is its only roster.
  - MEMBER DIRECTORY IS LOGIN-GATED (probed 2026-09-17). /member-directory and every /member-directory/<slug> return 'Restricted
    Page'; search engines have them indexed but an anonymous fetch does not.
  - sitemap.xml is public and lists 3,536 URLs, of which exactly ONE is a member-directory page — the roster is genuinely
    not published.
  - 'The TMAT directory (/tmat-directory, 73 component manufacturers) IS public, but the detail pages carry only an <h1> name:
    no address, no city, no state. Names alone would add T0 leads and lift recall without locating a plant.'
  - Chapter pages (/chapter/<slug>, 28 of them incl. Colorado Truss Manufacturers, TMAT, Wisconsin Truss Manufacturers) are
    public but list no members — chapter info and site nav only.
  - 91 of the 241 ADL control rows are trusses and structural components. An SBCA membership is the single highest-value unlock
    available to this project.
  status: blocked
  url: https://www.sbcacomponents.com/member-directory
- id: pci_certified
  name: PCI certified plants (republished in Ascent magazine)
  class: C
  method: browser
  needs_classify: false
  ai_extraction: true
  carries:
  - plant_address
  - product_types
  - certification_category
  status_basis: certified
  traps:
  - The Ascent magazine PDFs the entry used to point at are real but stop in 2016. The live grid is the directory.
  - 'A plain fetch returns a REGIONAL DEFAULT of ~12 plants (CO/ID/MT/UT). The roster only appears after the form is submitted,
    so this is a genuine browser job: one submit per state.'
  - NOT every PCI plant is IC. The certification covers rail ties, box culverts, pipe and piles as readily as building precast.
    Keep a plant only when its own 'Products Produced' names a building product.
  - The state dropdown mixes in Alberta, Yukon, Western Australia and the Armed Forces regions, and 'WA' is the code for BOTH
    Washington and Western Australia. Filter by LABEL, never by code.
  - Result cells run name-then-address and many names carry a comma ('Basin Precast, Inc. 34956 Co Rd 126'), so the street
    starts at its house number, not after the name.
  - '2026-09-17 sweep: selecting a state and clicking submit does NOT filter the grid. 46 pages archived, 42 of them the empty
    form at exactly 80,648 bytes; the 10 plants that came back are the page''s own default region (CO/ID/MT/UT). Correct option
    values and a settle delay for the dropdown''s own postback both made no difference. The form wants more than the state:
    try the query-type dropdown (''Search by PCI Certified Plant Location'') or a certification category first. parse() now
    refuses a sweep where half the states come back empty.'
  - 'Second and third attempts also failed: selecting the query type (''Search by PCI Certified Plant Location'') BEFORE the
    state still returns 0 rows for TX, and the grid has no pager, no item count and no page-size control — the 12 default
    rows are the whole result, not page one. Those 12 span CO, ID, MT and UT, four contiguous mountain states, which looks
    like IP geolocation rather than a saved query. If so the state dropdown may be ANDing with a geographic default and can
    never widen it. The remaining idea is the OTHER query type, ''Search Miles from Project Zip Code'': sweep ~50 ZIPs at
    a large radius instead of 50 states. Not attempted — 3 control rows did not justify a fourth approach.'
  status: queued_needs_work
  url: https://www.pci.org/PCIMS/Directories/Certified_Plants_Search.aspx
- id: mbi_members
  name: MBI member directory
  class: D
  method: fetch
  url: https://members.modular.org/{directory}/FindStartsWith?term={letter}
  acquire: web-first
  needs_classify: false
  carries:
  - street_address
  - manufacturer_or_dealer_flag
  status_basis: on_current_list
  traps:
  - 26-fetch A–Z sweep. Manufacturer/Direct field mechanically separates plants from dealers.
  - Membership is international. 31 of 182 manufacturers are outside the US (ON, Varsinais-Suomi, ...); a two-letter state
    is not proof of a US row, since Canadian provinces are two letters too.
  - An empty letter is normal (Y has 0 members, X and Z have 1); only an empty DIRECTORY is a fault.
  status: active
- id: apa_mills
  name: APA certified mills
  class: D
  method: browser
  needs_classify: false
  carries:
  - mill_number
  - plant_address
  status_basis: certified
  traps:
  - 'Probed 2026-09-17, two attempts. /about-apa/apa-certified-manufacturers/ answers 200 with 96KB but holds no mill in the HTML, and rendering it with Chromium plus twelve scrolls gives 100KB with zero MemberMill links and one address - the roster comes from an XHR not yet identified. /MemberMill?MemberMillID=<n> 404s when fetched directly, so the list page probably sets something first. WORTH a third attempt from the XHR: APA certifies glulam, CLT and structural panel mills, which is 8 Mass Timber plus 14 wood-panel control rows, and it is the directory that carries Mercer Conway - a control row we do not hold.'
  - Mill numbers are a stable per-facility join key — capture for cross-source dedupe.
  status: queued
- id: ias_ac472
  name: IAS AC472 accredited metal building plants
  class: D
  method: browser
  needs_classify: false
  carries:
  - plant_address
  status_basis: accredited
  traps:
  - 'Probed 2026-09-17, three approaches, stopping. /directory-of-accredited-companies/ 404s; the real page is /search-accredited-organizations-2/ whose form (action / method GET) offers service=13569 ''Metal Building Systems (AC472)''; a plain GET with that parameter returns 162KB of chrome and zero rows, and rendering it with Chromium and selecting the option returns 200KB with no table and no address. Results are fetched client-side from an endpoint not yet identified - try the wp-json routes or watch the XHR. NOT worth a fourth attempt on current evidence: IAS is the superset of MBMA membership, and MBMA''s 40 AC472 plants reached ~0 control rows, so the segment is already covered where it matters.'
  - Accredits the plant, not the corporation (~215 numbers). Better instrument for NAICS 332311 than MBMA.
  status: queued
- id: aisc_certified
  name: AISC certified companies
  class: D
  method: browser
  needs_classify: false
  carries:
  - plant_address
  status_basis: certified
  traps:
  - 'Probed 2026-09-17: /certification/ and /certification/certified-company-search/ both return HTTP 403 to an ordinary fetch, so AISC blocks automation at the edge rather than gating on login. Would need a different route entirely.'
  - 403s every plain fetch. Browser job.
  status: queued
- id: sipa
  name: SIPA manufacturing members
  class: C
