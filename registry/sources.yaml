- id: ny_dos
  name: New York DOS factory manufactured buildings
  class: A
  method: download
  url: https://dos.ny.gov/code/factory-manufactured-buildings-modular
  needs_classify: false
  carries:
  - approval_records
  status_basis: on_current_list
  traps:
  - 'Uploaded by hand 2026-09-17: 49 certified manufacturers, city only and no street, so the source lands at T0.'
  - Approval-centric, not plant-centric; extraction not clean. FOIL request drafted.
  acquire_note: no list published and dos.ny.gov blocks automation; upload the FOIL response
  acquire: blob-only
  status: active
- id: in_dhs
  name: Indiana DHS industrialized building systems registry
  class: A
  method: fetch
  needs_classify: false
  carries:
  - plant_address
  - manufacturer_id
  status_basis: on_current_list
  traps:
  - 'NOT an Indiana list: Indiana registers every manufacturer selling into the state, so the roster is national — 409 US
    plants across 46 states.'
  - 'Marked method: browser and left queued for months. It is a plain-HTML Struts app; no browser needed.'
  - Serves Windows-1252. Decoding as UTF-8 turned 'Mécanitec' into mojibake in the company's own name.
  - 'Keeps tombstones in place: one listing is a manufacturer named DELETE at a street address of DELETE.'
  - ZIPs are dirty (six and nine digits, some absent). Validate the STATE against the US list, never the ZIP — requiring a
    clean ZIP threw away six real plants.
  - Covers volumetric modular and mobile structures, not components. It overlaps the ADL control list by exactly one row.
  status: active
  url: https://oas.dhs.in.gov/dfbs/code/main.do
- id: nc_osfm
  name: North Carolina OSFM modular search
  class: A
  method: browser
  needs_classify: false
  carries:
  - plant_address
  - explicit_status
  status_basis: explicit_status_field
  traps:
  - 'Uploaded by hand 2026-09-17: 308 modular manufacturers across 39 states, a NATIONAL roster like Indiana''s. The same folder holds 9 approved third-party inspection agencies in an identical schema; they are dropped on their evidence line, never by filename.'
  - Form-gated.
  acquire: blob-only
  status: active
- id: ca_hcd
  name: California HCD factory-built housing
  class: A
  method: browser
  needs_classify: false
  carries:
  - business_address_often_hq
  status_basis: on_current_list
  traps:
  - 'Uploaded by hand 2026-09-17: 172 Active Manufacturer licences across 33 states. The address is the LICENCE address, not a plant.'
  - HCD issues no plant-level approval number; identifiers are per-model and per-unit. Plant identity is structurally unavailable.
  - Treat rows as company-level leads. Cap at T1 without a second source.
  acquire: blob-only
  status: active
- id: epa_frs
  name: EPA Facility Registry Service — national file
  class: B
  method: bulk
  url: https://ordsext.epa.gov/FLA/www3/state_files/national_combined.zip
  needs_classify: true
  carries:
  - lat_long
  - naics
  - program_ids
  status_basis: none
  core_naics:
  - '321991'
  - '321992'
  - '332311'
  - '321214'
  traps:
  - 5.3M rows. Joins on the API return 500; use the bulk file.
  - 321992 is mixed (~45% IC, ~33% sheds); some records are permits, not plants ("...Parking Expansion").
  - OSHA-OIS program rows are site visits — the strongest address attestation available.
  status: active
- id: osha_enforcement
  name: OSHA enforcement establishments
  class: B
  method: api
  needs_classify: true
  url: https://apiprod.dol.gov/v4/get/osha/inspection/csv
  carries:
  - site_visit_address
  status_basis: none
  traps:
  - Unlocks verification tier T3 — an OSHA inspection is the strongest address attestation in open data, because a compliance
    officer physically travelled to it. T3 is 80 of 4,081 facilities.
  - NEEDS A FREE DOL API KEY (probed 2026-09-17). The old bulk path enfxfr.dol.gov/data_catalog/OSHA/ now 301s to data.dol.gov,
    which is a client-rendered SPA serving the same 11 KB shell for every path.
  - The real endpoint is apiprod.dol.gov/v4/get/<agency>/<endpoint>/csv?X-API-KEY=... . /v4/datasets is public and keyless;
    every /v4/get/ call returns 401 without a key.
  - osha.gov/ords/imis/establishment.html answers 403 to any automated fetch, so the legacy establishment search is not a
    route either.
  - Register at dol.gov/developer; the key is free and self-serve. Put it in the environment as DOL_API_KEY and this source
    can be written in an hour.
  status: blocked_needs_key
