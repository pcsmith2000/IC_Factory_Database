# Run configuration. Secrets are NOT here — they come from the environment
# (GitHub Actions secrets locally exported, or GCP Secret Manager in Cloud Run).

storage:
  local_cache: .cache/ic-sources           # where a run stages downloads: <source>/<date>/<file>

archive:                                   # raw files, off the runner. Vercel Blob when BLOB_READ_WRITE_TOKEN is set
  engine: vercel_blob                      # (IC_ARCHIVE=off disables). Keys: <prefix>/<source>/<date>/<file> + manifest.json
  mode: blob-only                          # THE RUN NEVER SCRAPES. Layer 1 reads the files already in the
                                           # store; populating the store is a separate, deliberate step:
                                           #   python -m pipeline.sources.refresh <source_id|--all>
                                           # `acquire: web-first` per source opts one back into fetching.
  prefix: ic-sources
  access: public                           # must match how the Blob store itself was created;
                                           # a mismatch is rejected ('Cannot use private access on a public store')
  max_file_mb: 100                         # larger files are recorded by sha256 only (EPA zip: its filtered slice is archived instead)

warehouse:
  engine: sqlite                           # local default. DATABASE_URL in the env selects postgres (Neon now,
  sqlite_path: build/ic_factory.sqlite     # Cloud SQL for PostgreSQL later) — same schema, one loader (docs/warehouse.md)

frame:
  source: census_cbp
  naics: ["321991", "321992", "332311", "321214"]
  level: state                             # county is 30% complete — never used as a denominator
  vintage: "2023"                          # refresh annually
  establishments_total: 2750               # control total; treated as a FLOOR

control:
  path: control/control-triaged.csv
  checksum_path: control/control.sha256
  in_scope_rows: 213
  total_rows: 241

classifier:
  prompt_path: prompts/CLASSIFIER-PROMPT.md
  # PROVISIONAL — replace with whatever `python -m pipeline.bakeoff` measures. Recorded in every
  # run record and in the release tag, so changing it is a versioned change G5 must re-pass.
  # claude-sonnet-4-5 was pinned here and is strictly dominated: $1.80 per full run against $1.20
  # for the newer claude-sonnet-5 and $0.60 for this. The gateway also carries open-weight models
  # at ~$0.02 a run; whether any clears precision 0.95 / recall 0.90 on the 60 seeds is a question
  # for the bake-off, not for whoever edits this line. Written first-party style; the gateway form
  # (anthropic/claude-haiku-4.5) is derived in pipeline.ai_client_and_model.
  # Measured by `python -m pipeline.bakeoff` over the 60 seeds, ~$0.06 per full run.
  #
  # UNSTABLE, and the number to distrust is any single score. This model cleared the gate at
  # precision 97% / recall 100% on 2026-09-16, then FAILED it at 96% / 83% on the next run —
  # same prompt, same seeds, temperature 0. amazon/nova-lite scored 97% / 97% at half the price
  # ($0.03) but on one observation, which the variance above says is not a verdict either.
  # Re-score both with --repeat before trusting this pin; G5 still guards every real run.
  model: openai/gpt-oss-120b
  temperature: 0
  batch_size: 100
  seeded_positives: 30
  seeded_negatives: 30
  labels: [IC, NOT-IC, UNCERTAIN]

gates:
  # TEMPORARY CALIBRATION — revert to 0.02 when Layer 4 (entity resolution) is built.
  # G1 counts duplicate pairs that SURVIVED resolution. pipeline/resolve.py is an explicit stub
  # (resolution_rate 0.0), so the `entity+street` signature in pipeline/reconcile.py is
  # unreachable and one plant takes two ids whenever one roster carries a street address and
  # another carries only city+state — 63 of the 124 pairs in the 2026-09-15 run are that exact
  # shape, which is 8.8% against the 2% ceiling this gate was calibrated to with a working
  # resolver. 0.02 is the real target and this 0.10 buys nothing but a runnable pipeline; every
  # pair is still written to build/dedupe_audit_<date>.csv for review either way.
  g1_dedupe_max_rate: 0.10
  g1_thresholds: {street_key: 0.95, name_city: 0.90, fuzzy: 0.80}
  g3_allow_new_ids_on_rerun: 0
  g5_min_precision: 0.95
  g5_min_recall: 0.90

measure:
  bias_band: [0.7, 1.4]
  bias_min_state_share: 0.02

validate:
  row_count_drift_tolerance: 0.25          # pull halts for that source if |rows - last_rows| / last_rows exceeds this
