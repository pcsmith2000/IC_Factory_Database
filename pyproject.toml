[project]
name = "ic-factory-database"
version = "1.0.0"
description = "Fixed end-to-end ingestion pipeline for the US industrialized-construction facility database"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
# openpyxl is an `acquire` dependency, but tests/test_sources.py pins the XLSX parsing
# contract and imports it directly. Without it here the whole module errors out under
# CI's `[dev,postgres]` install and eight tests silently stop running.
dev = ["pytest>=8", "openpyxl>=3.1"]
postgres = ["psycopg[binary]>=3.1"]
acquire = ["pdfplumber>=0.11", "openpyxl>=3.1", "beautifulsoup4>=4.12", "playwright>=1.47", "google-cloud-storage>=2.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
