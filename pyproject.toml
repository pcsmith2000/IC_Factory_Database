[project]
name = "ic-factory-database"
version = "1.0.0"
description = "Fixed end-to-end ingestion pipeline for the US industrialized-construction facility database"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
acquire = ["requests>=2.32", "playwright>=1.47", "google-cloud-storage>=2.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
